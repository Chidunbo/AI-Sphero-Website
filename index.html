<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sphero Gesture Controller</title>

    <link rel="stylesheet" href="style.css" />

    <!-- TensorFlow.js and Teachable Machine Image library -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
    
    <!-- Gesture Configuration (modular and customizable) -->
    <script src="gesture-config.js"></script>
</head>

<body>
    <div class="header">
        <h1>Sphero Gesture Controller</h1>
        <p class="subtitle">Control your Sphero BOLT with hand gestures!</p>
    </div>

    <div class="container">
        <!-- Column 1: Setup -->
        <div class="column setup-column">
            <h2>Setup</h2>
            
            <!-- Row 1: Model Loaded Button and Categories -->
            <div class="setup-row">
                <button id="startBtn" class="btn-primary">Load Model</button>
                <div id="model-categories" class="model-categories"></div>
            </div>
            
            <!-- Row 2: Camera View and Button -->
            <div class="setup-row">
                <div id="webcam-container" class="webcam-box">
                    <p class="webcam-placeholder">Webcam will appear here</p>
                </div>
                <button id="turnOnCameraBtn" class="btn-primary">Camera On</button>
            </div>
            
            <button id="connectBtn" class="btn-primary">Connect to Sphero BOLT</button>
            <div id="connectionStatus" class="status">Not connected</div>
        </div>

        <!-- Column 2: Prediction -->
        <div class="column prediction-column inactive">
            <h2>Prediction</h2>
            <div id="label-container" class="predictions"></div>

            <div class="gesture-display">
                <h3>Detected Gesture</h3>
                <div id="gestureOutput" class="gesture-name">–</div>
                <div class="confidence">
                    Confidence: <span id="confidenceOutput">0%</span>
                </div>
            </div>
            
            <div class="debug-section" style="margin-top: 20px;">
                <h3>Debug Terminal</h3>
                <div id="debug-terminal" class="debug-terminal"></div>
            </div>
        </div>

        <!-- Column 3: Sphero Command -->
        <div class="column command-column inactive">
            <h2>Sphero Command</h2>
            
            <div class="debug-section">
                <h3>Virtual LED Matrix</h3>
                <div id="virtual-matrix" class="virtual-matrix"></div>
                <div id="matrix-info" class="matrix-info">Matrix: Off</div>
                
                <h3 style="margin-top: 20px;">Movement Status</h3>
                <div id="movement-status" class="movement-status">Status: Idle</div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
